# =============================================================================
# Production Docker Compose for Song-moodboard
# Used on the server/VPS: Pulls prebuilt images from GHCR without rebuilding!
# =============================================================================
services:
  # 1. Reverse Proxy: Nginx (Only public gateway port 1122)
  nginx:
    image: nginx:1.27-alpine
    container_name: songmoodboard_nginx
    restart: always
    ports:
      - "${PORT:-1122}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - song-moodboard-net

  # 2. Frontend: SvelteKit SSR (Pulls pre-built image)
  frontend:
    image: ${IMAGE_FRONTEND:-ghcr.io/ijon6k/song-moodboard-frontend:latest}
    container_name: songmoodboard_frontend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - ORIGIN=${APP_ORIGIN:-http://localhost:1122}
    networks:
      - song-moodboard-net

  # 3. Backend: Go API + yt-dlp & FFmpeg engine (Pulls pre-built image)
  backend:
    image: ${IMAGE_BACKEND:-ghcr.io/ijon6k/song-moodboard-backend:latest}
    container_name: songmoodboard_backend
    restart: always
    environment:
      - PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-song-moodboard}
      - DB_PASSWORD=${DB_PASSWORD:-songmoodboard_secret}
      - DB_NAME=${DB_NAME:-songmoodboard_db}
      - DB_SSLMODE=disable
      - REDIS_ADDR=redis:6379
      - SEAWEED_ENDPOINT=seaweedfs:8333
      - SEAWEED_ACCESS_KEY=${SEAWEED_ACCESS_KEY:-anykey}
      - SEAWEED_SECRET_KEY=${SEAWEED_SECRET_KEY:-anysecret}
      - SEAWEED_BUCKET=${SEAWEED_BUCKET:-song-moodboard}
      - JWT_SECRET=${JWT_SECRET:-super-secret-twilight-haze-key-2026}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - song-moodboard-net

  # 4. Relational Database: PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: songmoodboard_postgres
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER:-song-moodboard}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-songmoodboard_secret}
      - POSTGRES_DB=${DB_NAME:-songmoodboard_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-song-moodboard} -d ${DB_NAME:-songmoodboard_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - song-moodboard-net

  # 5. In-Memory Cache: Redis 7
  redis:
    image: redis:7-alpine
    container_name: songmoodboard_redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - song-moodboard-net

  # 6. Object Storage: SeaweedFS (Master + Volume + S3 Gateway)
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: songmoodboard_seaweedfs
    restart: always
    command: "server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data"
    volumes:
      - seaweedfs_data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    networks:
      - song-moodboard-net

networks:
  song-moodboard-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  seaweedfs_data:
