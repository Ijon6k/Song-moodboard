name: Song Moodboard CI/CD Pipeline

on:
  push:
    branches: [ "main", "dev" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Backend CI (Go Test & Lint)
  # ---------------------------------------------------------------------------
  backend-ci:
    name: Backend CI (Go 1.23)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum

      - name: Download Go dependencies
        run: go mod download

      - name: Run Go vet
        run: go vet ./...

      - name: Run Go unit tests
        run: go test -v -race ./...

  # ---------------------------------------------------------------------------
  # Job 2: Frontend CI (SvelteKit + Bun)
  # ---------------------------------------------------------------------------
  frontend-ci:
    name: Frontend CI (SvelteKit & Bun)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build SvelteKit application
        run: bun run build

  # ---------------------------------------------------------------------------
  # Job 3: Docker Multi-Stage Build & Push to GHCR
  # ---------------------------------------------------------------------------
  docker-build-push:
    name: Build & Push Docker Images
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Tagging Strategy for Backend ---
      - name: Extract Docker metadata (Backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/song-moodboard-backend
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build & Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Tagging Strategy for Frontend ---
      - name: Extract Docker metadata (Frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/song-moodboard-frontend
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build & Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Job 4: Integration & Smoke Testing (Port 1122 Verification)
  # ---------------------------------------------------------------------------
  smoke-test:
    name: Local Stack Simulation & Smoke Test
    needs: [docker-build-push]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start Full Stack with Docker Compose
        run: |
          docker compose up -d --build

      - name: Wait for API and Storage Health
        run: |
          echo "Waiting for services to become healthy on port 1122..."
          for i in {1..30}; do
            if curl -s -f http://localhost:1122/api/health | grep -q '"status":"healthy"'; then
              echo "Song Moodboard API healthy on port 1122!"
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
          echo "Healthcheck timed out!"
          docker compose logs
          exit 1

      - name: Verify Frontend SSR Status 200
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:1122/)
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Frontend SSR responded with HTTP 200."
          else
            echo "Unexpected HTTP status: $HTTP_STATUS"
            exit 1
          fi

      - name: Verify Private Port Isolation (Security Check)
        run: |
          # 8080 (Go API) and 5432 (Postgres) must NOT be open on host
          nc -z -w2 localhost 8080 && { echo "Error: Internal API port 8080 exposed!"; exit 1; } || echo "Port 8080 properly isolated."
          nc -z -w2 localhost 5432 && { echo "Error: Internal DB port 5432 exposed!"; exit 1; } || echo "Port 5432 properly isolated."

      - name: Teardown
        if: always()
        run: docker compose down -v
