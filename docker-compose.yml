# =============================================================================
# Song-moodboard: Standalone Self-Hosted Docker Compose
# Download only this file, then run: docker compose up -d
# Zero local file dependencies (Nginx & SeaweedFS configs are generated inline)
# =============================================================================
services:
  # 1. Reverse Proxy: Nginx (Gateway port 1122)
  nginx:
    image: nginx:1.27-alpine
    container_name: songmoodboard_nginx
    restart: always
    ports:
      - "${PORT:-1122}:80"
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat <<'EOF' > /etc/nginx/conf.d/default.conf
        resolver 127.0.0.11 valid=10s ipv6=off;
        client_max_body_size 50M;

        server {
            listen 80;
            server_name _;

            location /api/ {
                set $$backend http://backend:8080;
                proxy_pass $$backend;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $$http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $$host;
                proxy_set_header X-Real-IP $$remote_addr;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $$scheme;
                proxy_buffering off;
                proxy_read_timeout 120s;
            }

            location / {
                set $$frontend http://frontend:3000;
                proxy_pass $$frontend;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $$http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $$host;
                proxy_set_header X-Real-IP $$remote_addr;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $$scheme;
            }
        }
        EOF
        exec nginx -g "daemon off;"
    depends_on:
      - frontend
      - backend
    networks:
      - song-moodboard-net

  # 2. Frontend: SvelteKit SSR (Pulls pre-built image or builds locally)
  frontend:
    image: ${IMAGE_FRONTEND:-song-moodboard-frontend:latest}
    container_name: songmoodboard_frontend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - ORIGIN=${APP_ORIGIN:-http://localhost:1122}
    networks:
      - song-moodboard-net

  # 3. Backend: Go API + yt-dlp & FFmpeg engine (Pulls pre-built image or builds locally)
  backend:
    image: ${IMAGE_BACKEND:-song-moodboard-backend:latest}
    container_name: songmoodboard_backend
    restart: always
    environment:
      - PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-songmoodboard}
      - DB_PASSWORD=${DB_PASSWORD:-songmoodboard_secret}
      - DB_NAME=${DB_NAME:-songmoodboard_db}
      - DB_SSLMODE=disable
      - REDIS_ADDR=redis:6379
      - SEAWEED_ENDPOINT=seaweedfs:8333
      - SEAWEED_ACCESS_KEY=${SEAWEED_ACCESS_KEY:-anykey}
      - SEAWEED_SECRET_KEY=${SEAWEED_SECRET_KEY:-anysecret}
      - SEAWEED_BUCKET=${SEAWEED_BUCKET:-songmoodboard}
      - JWT_SECRET=${JWT_SECRET:-super-secret-twilight-haze-key-2026}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - song-moodboard-net

  # 4. Relational Database: PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: songmoodboard_postgres
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER:-songmoodboard}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-songmoodboard_secret}
      - POSTGRES_DB=${DB_NAME:-songmoodboard_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-songmoodboard} -d ${DB_NAME:-songmoodboard_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - song-moodboard-net

  # 5. In-Memory Cache: Redis 7
  redis:
    image: redis:7-alpine
    container_name: songmoodboard_redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - song-moodboard-net

  # 6. Object Storage: SeaweedFS (Master + Volume + S3 Gateway)
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: songmoodboard_seaweedfs
    restart: always
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /etc/seaweedfs
        cat <<'EOF' > /etc/seaweedfs/s3.json
        {
          "identities": [
            {
              "name": "anonymous",
              "actions": ["Admin", "Read", "Write"]
            },
            {
              "name": "song-moodboard",
              "credentials": [
                {
                  "accessKey": "${SEAWEED_ACCESS_KEY:-anykey}",
                  "secretKey": "${SEAWEED_SECRET_KEY:-anysecret}"
                }
              ],
              "actions": ["Admin", "Read", "Write"]
            }
          ]
        }
        EOF
        exec weed server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data
    volumes:
      - seaweedfs_data:/data
    networks:
      - song-moodboard-net

networks:
  song-moodboard-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  seaweedfs_data:
