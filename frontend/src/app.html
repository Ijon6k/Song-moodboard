<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%238FB3D5'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z'/></svg>" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Song Moodboard - Serenity in Sound and Atmosphere</title>
  <meta name="description"
    content="A minimalist soundscape and visual moodboard archive. Curate photographs, lyrics, and colors for every melody." />
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('songmoodboard_theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (theme === 'dark' || (!theme && prefersDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) { }
    })();
  </script>
  <!-- Google Fonts: Poppins, Lora, & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Lora:ital,wght@0,400;0,500;1,400&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap"
    rel="stylesheet">
  %sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover"
  class="bg-calm-bg text-calm-text font-sans antialiased selection:bg-calm-blue-subtle selection:text-calm-blue-deep min-h-screen">
  <div style="display: contents">%sveltekit.body%</div>
</body>

</html>
